name: auto-merge

# The "robot": queues a PR for merge as soon as it is opened or updated.
# GitHub itself performs the merge, and only after every required check passes
# (currently `markdown-only`, from .github/workflows/markdown-only.yml).
#
# A PR containing a non-Markdown file fails that check, so it stays open and
# unmerged. This workflow never bypasses a check — it only arms auto-merge.
#
# GitHub's auto-merge does not reliably honour `--delete-branch`, so the head
# branch is deleted explicitly after a successful merge.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    name: arm-auto-merge
    # Skip drafts, closed PRs, and PRs from forks: their token is read-only and
    # the branch is not ours to merge.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch; then
            echo "::warning::Could not arm auto-merge for PR #$PR (already merged, conflicted, or checks failing)."
          fi

  cleanup:
    name: delete-merged-branch
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"; then
            echo "Deleted branch $BRANCH"
          else
            echo "::warning::Could not delete $BRANCH (already gone or protected)."
          fi
