name: branch-cleanup

# GitHub's auto-merge does not reliably honour `delete_branch_on_merge`, and a
# `pull_request: closed` trigger does not fire for auto-merged PRs. So cleanup
# runs on `pull_request_target: closed`, which uses the base-branch workflow and
# a write-capable token.
#
# This workflow never checks out or runs PR code, so `pull_request_target` is
# safe here.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    name: delete-merged-branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" 2>/dev/null; then
            echo "Deleted branch $BRANCH"
          else
            echo "::warning::Could not delete $BRANCH (already gone or protected)."
          fi
